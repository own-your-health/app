name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The scope-test page runs only under the dev server.
      - name: Production build leaves out the scope test
        run: "! grep -rl 'scope-test' dist"
      # Installing the app needs the manifest linked and every icon present.
      - name: Production build carries the manifest and its icons
        run: node scripts/check-install.mjs dist
      # The sample is what medrec 0.9.7 writes, by this exact build.
      - name: Install medrec 0.9.7
        env:
          MEDREC_URL: https://github.com/own-your-health/medrec-cli/releases/download/v0.9.7/medrec-x86_64-unknown-linux-gnu.tar.gz
          MEDREC_SHA256: 7767c8995a94950fca4e6b9a93cd06314563697f48d34c2a9167dab069ac2e9f
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/medrec.tar.gz" "$MEDREC_URL"
          echo "$MEDREC_SHA256  $RUNNER_TEMP/medrec.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/medrec"
          tar xzf "$RUNNER_TEMP/medrec.tar.gz" -C "$RUNNER_TEMP/medrec"
      # The sample folder is generated; it must match its generator.
      - name: Sample folder matches its generator
        env:
          MEDREC: ${{ runner.temp }}/medrec/medrec
        run: |
          node scripts/demo-folder.mjs "$RUNNER_TEMP/sample"
          diff -r "$RUNNER_TEMP/sample" public/demo
      # medrec 0.9.9 writes what the sample's release does not yet.
      - name: Install medrec 0.9.9
        env:
          MEDREC_URL: https://github.com/own-your-health/medrec-cli/releases/download/v0.9.9/medrec-x86_64-unknown-linux-gnu.tar.gz
          MEDREC_SHA256: cac7992477055e653da0512c219c412d6d2c1cd277aec80d3ab2e7c719b76ea2
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/medrec-0.9.9.tar.gz" "$MEDREC_URL"
          echo "$MEDREC_SHA256  $RUNNER_TEMP/medrec-0.9.9.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/medrec-0.9.9"
          tar xzf "$RUNNER_TEMP/medrec-0.9.9.tar.gz" -C "$RUNNER_TEMP/medrec-0.9.9"
      # And medrec 0.9.10 what neither does yet: a result's parts, bounds and the results a panel lists.
      - name: Install medrec 0.9.10
        env:
          MEDREC_URL: https://github.com/own-your-health/medrec-cli/releases/download/v0.9.10/medrec-x86_64-unknown-linux-gnu.tar.gz
          MEDREC_SHA256: 5f676d81626b4803a2c40cc1c75425cf63b3639f06bd8f003e1aa85aac3b06b0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/medrec-0.9.10.tar.gz" "$MEDREC_URL"
          echo "$MEDREC_SHA256  $RUNNER_TEMP/medrec-0.9.10.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/medrec-0.9.10"
          tar xzf "$RUNNER_TEMP/medrec-0.9.10.tar.gz" -C "$RUNNER_TEMP/medrec-0.9.10"
      # So are the cases the tests read: medrec writes each, never a hand.
      - name: Private-items, bill, label, rule, entered-in-error and result cases match their generators
        env:
          MEDREC: ${{ runner.temp }}/medrec/medrec
          MEDREC_099: ${{ runner.temp }}/medrec-0.9.9/medrec
          MEDREC_0910: ${{ runner.temp }}/medrec-0.9.10/medrec
        run: |
          node scripts/private-fixtures.mjs
          node scripts/bill-fixtures.mjs
          node scripts/label-fixtures.mjs
          node scripts/rule-fixtures.mjs
          MEDREC="$MEDREC_099" node scripts/error-fixtures.mjs
          MEDREC="$MEDREC_0910" node scripts/result-fixtures.mjs
          git diff --exit-code -- test/fixtures
          test -z "$(git status --porcelain -- test/fixtures)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit
        run: npm audit --audit-level=high

      # The gitleaks CLI, not gitleaks-action: the action needs a paid
      # license on an organization's repository. The checksum is pinned
      # here, so a replaced release asset fails the job.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
