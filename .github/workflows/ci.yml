name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The scope-test page runs only under the dev server.
      - name: Production build leaves out the scope test
        run: "! grep -rl 'scope-test' dist"
      # Installing the app needs the manifest linked and every icon present.
      - name: Production build carries the manifest and its icons
        run: node scripts/check-install.mjs dist
      # The sample's views are medrec's own: its generator runs medrec 0.9.3,
      # this exact build.
      - name: Install medrec 0.9.3
        env:
          MEDREC_URL: https://github.com/own-your-health/medrec-cli/releases/download/v0.9.3/medrec-x86_64-unknown-linux-gnu.tar.gz
          MEDREC_SHA256: 2e433d5eb7ddd3586b1c810c5996967198c1622cc377db8d28fe822e9e3bf4f1
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/medrec.tar.gz" "$MEDREC_URL"
          echo "$MEDREC_SHA256  $RUNNER_TEMP/medrec.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/medrec"
          tar xzf "$RUNNER_TEMP/medrec.tar.gz" -C "$RUNNER_TEMP/medrec"
      # The sample folder is generated; it must match its generator.
      - name: Sample folder matches its generator
        env:
          MEDREC: ${{ runner.temp }}/medrec/medrec
        run: |
          node scripts/demo-folder.mjs
          git diff --exit-code -- public/demo
          test -z "$(git status --porcelain -- public/demo)"
      # So are the private-items cases: medrec writes each list, never a hand.
      - name: Private-items cases match their generator
        env:
          MEDREC: ${{ runner.temp }}/medrec/medrec
        run: |
          node scripts/private-fixtures.mjs
          git diff --exit-code -- test/fixtures/private
          test -z "$(git status --porcelain -- test/fixtures/private)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit
        run: npm audit --audit-level=high

      # The gitleaks CLI, not gitleaks-action: the action needs a paid
      # license on an organization's repository. The checksum is pinned
      # here, so a replaced release asset fails the job.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
